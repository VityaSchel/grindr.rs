name: Publish (crates.io)
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: tag to publish
        type: string
        required: true

concurrency:
  group: grindr-crates-${{ forgejo.event.inputs.tag || forgejo.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ["toolchain", "4c8g", "hetzner"]
    timeout-minutes: 20

    defaults:
      run:
        shell: >-
          /usr/bin/env
          -u GITHUB_TOKEN -u FORGEJO_TOKEN
          -u ACTIONS_RUNTIME_TOKEN
          -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL
          -u ACTIONS_CACHE_URL -u ACTIONS_RUNTIME_URL -u ACTIONS_RESULTS_URL
          bash --noprofile --norc -e -o pipefail {0}

    env:
      RELEASE_TAG: ${{ forgejo.event.inputs.tag || forgejo.event.release.tag_name }}
      WORKSPACE: /opt/grindr-crates
      CARGO_HOME: /opt/rust/cargo
      RUSTUP_HOME: /opt/rust/rustup
      CARGO_TERM_COLOR: never
      CARGO_TERM_PROGRESS_WHEN: never
      RUST_VERSION: "1.95.0"

    steps:
      - name: Verify CI environment
        run: |
          leaked=$(env | grep -iE '(TOKEN|SECRET|PASSWORD|CREDENTIAL|KEY)=.' || true)
          [ -z "$leaked" ] || { echo "FATAL: privileged credential reachable by build code:"; echo "$leaked" | sed 's/=.*/=<redacted>/'; exit 1; }

      - name: Check out
        run: |
          : "${WORKSPACE:?}" "${RELEASE_TAG:?}"
          rm -rf "$WORKSPACE"
          mkdir -p "$WORKSPACE"
          cd "$WORKSPACE"

          git init -q .
          git remote add origin "$FORGEJO_SERVER_URL/$FORGEJO_REPOSITORY.git"
          git fetch -q --depth 1 origin "refs/tags/$RELEASE_TAG"
          git checkout -q FETCH_HEAD
          if [ "$FORGEJO_REF" = "refs/tags/$RELEASE_TAG" ] && [ -n "$FORGEJO_SHA" ]; then
            [ "$(git rev-parse HEAD)" = "$FORGEJO_SHA" ] \
              || { echo "FATAL: tag moved since the run was queued (want $FORGEJO_SHA, got $(git rev-parse HEAD))"; exit 1; }
          fi
          echo "publishing $RELEASE_TAG at $(git rev-parse HEAD)"

      - name: Use the baked toolchain
        run: |
          baked=$(cat /opt/rust/toolchain)
          [ "$baked" = "$RUST_VERSION" ] \
            || { echo "FATAL: the toolchain image has Rust $baked but RUST_VERSION is $RUST_VERSION — align it with RUST_VERSION in open-grind ci/check-image.sh"; exit 1; }
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          "$CARGO_HOME/bin/cargo" --version
          "$CARGO_HOME/bin/cargo" fmt --version
          "$CARGO_HOME/bin/cargo" clippy --version

      - name: Match the tag to the crate version
        run: |
          cd "$WORKSPACE"
          pkgid=$(cargo pkgid --locked)
          version=${pkgid##*[#@]}
          case "${RELEASE_TAG#v}" in
            "$version" | "${version%%+*}") echo "tag $RELEASE_TAG matches $version" ;;
            *) echo "FATAL: tag $RELEASE_TAG does not match crate version $version"; exit 1 ;;
          esac

      - name: Format
        run: cd "$WORKSPACE" && cargo fmt --check

      - name: Clippy
        run: cd "$WORKSPACE" && cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cd "$WORKSPACE" && cargo test --locked

      - name: Docs
        run: cd "$WORKSPACE" && RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --locked

      - name: Publish package
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: |
          : "${CARGO_REGISTRY_TOKEN:?}"
          cd "$WORKSPACE"
          cargo publish --locked
